<div class="w-full flex items-center justify-center pt-4 pb-2 relative">
<div class="relative w-44 h-36 flex items-center justify-center">
<!-- Ambient Backing Spheres (Soft Clay Accents) -->
<div class="absolute -top-1 left-2 w-8 h-8 rounded-full bg-icon-bg-mint transition-transform duration-700 ease-out animate-pulse" style="box-shadow: 4px 6px 12px rgba(110, 90, 180, 0.15), -3px -3px 8px rgba(255, 255, 255, 0.9), inset -2px -2px 4px rgba(110, 90, 180, 0.08), inset 2px 2px 4px rgba(255, 255, 255, 0.95);"></div>
<div class="absolute -bottom-2 -left-2 w-6 h-6 rounded-full bg-tag-gap-bg" style="box-shadow: 3px 5px 10px rgba(110, 90, 180, 0.14), -2px -2px 6px rgba(255, 255, 255, 0.9), inset -2px -2px 4px rgba(122, 83, 0, 0.12), inset 2px 2px 4px rgba(255, 255, 255, 0.9);"></div>
<div class="absolute top-2 -right-1 w-7 h-7 rounded-full bg-icon-bg-lavender" style="box-shadow: 4px 6px 12px rgba(110, 90, 180, 0.16), -3px -3px 8px rgba(255, 255, 255, 0.85), inset -2px -2px 4px rgba(91, 59, 184, 0.12), inset 2px 2px 4px rgba(255, 255, 255, 0.9);"></div>
<!-- Puffy White Clay Card Container -->
<div class="relative w-32 h-24 rounded-lg bg-gradient-to-b from-surface-container-lowest to-[#FAF8FF] flex flex-col justify-center px-4 gap-2 z-10" style="box-shadow: 10px 14px 24px rgba(110, 90, 180, 0.16), -6px -6px 16px rgba(255, 255, 255, 0.9), inset -3px -3px 6px rgba(110, 90, 180, 0.08), inset 3px 3px 6px rgba(255, 255, 255, 0.85);">
<!-- Debossed horizontal score lines -->
<div class="w-10 h-2 rounded-full bg-canvas-light" style="box-shadow: inset 1px 1px 2px rgba(110,90,180,0.18), inset -1px -1px 2px rgba(255,255,255,0.8);"></div>
<div class="w-20 h-2 rounded-full bg-canvas-light" style="box-shadow: inset 1px 1px 2px rgba(110,90,180,0.18), inset -1px -1px 2px rgba(255,255,255,0.8);"></div>
<div class="w-14 h-2 rounded-full bg-canvas-light" style="box-shadow: inset 1px 1px 2px rgba(110,90,180,0.18), inset -1px -1px 2px rgba(255,255,255,0.8);"></div>
</div>
<!-- Friendly Puffy Clay Waving Hand -->
<div class="absolute -top-3 right-3 z-20 flex items-center justify-center transform -rotate-6 hover:rotate-12 transition-transform duration-300" title="Welcome!">
<div class="w-14 h-14 rounded-full bg-icon-bg-peach flex items-center justify-center relative cursor-pointer" style="box-shadow: 6px 10px 18px rgba(180, 110, 90, 0.22), -4px -4px 12px rgba(255, 255, 255, 0.95), inset -3px -3px 6px rgba(180, 90, 60, 0.12), inset 3px 3px 6px rgba(255, 255, 255, 0.9);">
<span class="material-symbols-outlined text-tag-gap-text text-[32px] select-none" style="font-variation-settings: 'FILL' 1;">
            waving_hand
          </span>
<!-- Soft Specular Reflection Dot -->
<div class="absolute top-2 left-3 w-2.5 h-1.5 rounded-full bg-surface-container-lowest opacity-70 rotate-[-30deg]"></div>
</div>
</div>
</div>
</div>
<!-- Heading and Subtitle -->
<div class="mt-4 mb-8 text-center flex flex-col items-center">
<h1 class="font-display-lg text-display-lg text-text-primary-light tracking-tight">
      Welcome back
    </h1>
<p class="font-body-md text-body-md text-text-secondary-light mt-1.5 max-w-[280px]">
      Log in once. You’ll stay signed in on this phone.
    </p>
</div>
<!-- Form Fields Stack -->
<div class="flex flex-col gap-5">
<!-- Username Field -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-text-primary-light px-1" for="username-input">
        Username
      </label>
<div class="h-14 w-full rounded-[20px] bg-canvas-light px-4 flex items-center justify-between transition-all focus-within:ring-2 focus-within:ring-primary/20" style="box-shadow: inset 3px 3px 6px rgba(110, 90, 180, 0.14), inset -3px -3px 6px rgba(255, 255, 255, 0.9);">
<div class="flex items-center gap-3 flex-1 min-w-0">
<span class="material-symbols-outlined text-text-secondary-light text-[20px] select-none" style="font-variation-settings: 'FILL' 1;">
            person
          </span>
<input autocomplete="username" class="bg-transparent border-0 outline-none w-full font-title-md text-body-md text-text-primary-light placeholder-text-placeholder p-0" id="username-input" type="text" value="aarav.m"/>
</div>
<!-- Verified State Indicator -->
<div aria-label="Verified username" class="w-6 h-6 rounded-full bg-tag-alias-bg flex items-center justify-center shrink-0 ml-2" style="box-shadow: inset 1px 1px 2px rgba(255, 255, 255, 0.9), 1px 2px 4px rgba(15, 106, 72, 0.15);">
<span class="material-symbols-outlined text-tag-alias-text text-[15px]" style="font-variation-settings: 'FILL' 1, 'wght' 700;">
            check
          </span>
</div>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-text-primary-light px-1" for="password-input">
        Password
      </label>
<div class="h-14 w-full rounded-[20px] bg-canvas-light px-4 flex items-center justify-between transition-all focus-within:ring-2 focus-within:ring-primary/20" style="box-shadow: inset 3px 3px 6px rgba(110, 90, 180, 0.14), inset -3px -3px 6px rgba(255, 255, 255, 0.9);">
<div class="flex items-center gap-3 flex-1 min-w-0">
<span class="material-symbols-outlined text-text-secondary-light text-[20px] select-none" style="font-variation-settings: 'FILL' 1;">
            lock
          </span>
<input autocomplete="current-password" class="bg-transparent border-0 outline-none w-full font-body-md text-body-md text-text-primary-light tracking-widest placeholder-text-placeholder p-0" id="password-input" type="password" value="supersecretpwd"/>
</div>
<button aria-label="Toggle password visibility" class="w-9 h-9 rounded-full flex items-center justify-center text-text-secondary-light hover:text-text-primary-light transition-colors active:scale-95 shrink-0 -mr-1" id="toggle-password-btn" type="button">
<span class="material-symbols-outlined text-[20px]" id="eye-icon">
            visibility
          </span>
</button>
</div>
</div>
</div>
<!-- Primary Action Button -->
<div class="mt-8">
<button class="w-full h-14 rounded-full bg-primary-container text-on-primary font-title-md text-body-md flex items-center justify-center gap-2 active:scale-[0.98] transition-all cursor-pointer relative overflow-hidden" style="box-shadow: 8px 12px 20px rgba(124, 108, 242, 0.35), -4px -4px 12px rgba(255, 255, 255, 0.8), inset 0 2px 4px rgba(255, 255, 255, 0.6);" type="button">
<span>Log in</span>
<span class="material-symbols-outlined text-[20px]">
        arrow_forward
      </span>
</button>
</div>
<!-- Footer Link Row -->
<div class="mt-8 flex items-center justify-center gap-1.5">
<span class="font-label-md text-label-md text-text-secondary-light">
      New here?
    </span>
<button class="font-label-md text-label-md text-primary font-bold hover:underline active:opacity-70 transition-opacity px-1 py-1" type="button">
      Create account
    </button>
</div>
</div>
<script>
  (function() {
    const toggleBtn = document.getElementById('toggle-password-btn');
    const pwdInput = document.getElementById('password-input');
    const eyeIcon = document.getElementById('eye-icon');

    if (toggleBtn && pwdInput && eyeIcon) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = pwdInput.type === 'password';
        pwdInput.type = isPassword ? 'text' : 'password';
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
        pwdInput.classList.toggle('tracking-widest', !isPassword);
      });
    }
  })();
</script></main></body></html>
