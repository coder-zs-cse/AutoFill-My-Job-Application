<script>
  // Ensure the shell's active tab styling perfectly aligns with Gaps empty state (zero gaps = no badge)
  (function updateShellNavForEmptyGaps() {
    const navItems = document.querySelectorAll('nav a');
    navItems.forEach((tab) => {
      const path = tab.getAttribute('data-path');
      if (path === 'gaps') {
        // Apply puffy lavender pill active state to Gaps
        tab.className = 'flex flex-col items-center justify-center min-w-[64px] h-[52px] px-space-sm rounded-lg bg-icon-bg-lavender text-tag-ai-text shadow-[inset_2px_2px_4px_rgba(255,255,255,0.8),inset_-2px_-2px_4px_rgba(110,90,180,0.12)] transition-all gap-0.5';
        
        // Remove counter badge strictly according to CRITICAL REQUIREMENT (empty gaps inbox)
        const badge = tab.querySelector('.bg-tag-gap-bg');
        if (badge) {
          badge.remove();
        }
      } else {
        // Return other tabs to unselected inactive state
        tab.className = 'flex flex-col items-center justify-center min-w-[64px] h-[52px] px-space-sm rounded-lg text-text-secondary-light hover:text-on-surface transition-all gap-0.5';
      }
    });
  })();
