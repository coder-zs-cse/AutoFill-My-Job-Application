<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-canvas-light text-on-surface font-body-md text-body-md antialiased min-h-screen flex flex-col justify-between pt-safe pb-safe"><main class="flex-1 flex flex-col w-full max-w-[480px] mx-auto px-margin bg-canvas-light"><div class="flex flex-col w-full select-none">
<!-- Top Progress Bar & Skip Action -->
<div class="pt-4 flex items-center justify-between w-full">
<!-- Clay Step Indicators -->
<div class="flex items-center gap-2">
<!-- Step 1 (Completed / Prior) -->
<div aria-hidden="true" class="w-2 h-2 rounded-full bg-[#D8D2EB]" style="box-shadow: inset 1px 1px 2px rgba(110, 90, 180, 0.25), inset -1px -1px 2px rgba(255, 255, 255, 0.9);">
</div>
<!-- Step 2 (Active Pill) -->
<div aria-label="Step 2 of 5" aria-valuemax="5" aria-valuemin="1" aria-valuenow="2" class="h-2 w-6 rounded-full bg-[#7C6CF2] transition-all duration-300" role="progressbar" style="box-shadow: 0 2px 6px rgba(124, 108, 242, 0.4), inset 0 1px 2px rgba(255, 255, 255, 0.6), inset -1px -1px 2px rgba(74, 58, 178, 0.4);">
</div>
<!-- Step 3 (Pending) -->
<div aria-hidden="true" class="w-2 h-2 rounded-full bg-[#D8D2EB]" style="box-shadow: inset 1px 1px 2px rgba(110, 90, 180, 0.25), inset -1px -1px 2px rgba(255, 255, 255, 0.9);">
</div>
<!-- Step 4 (Pending) -->
<div aria-hidden="true" class="w-2 h-2 rounded-full bg-[#D8D2EB]" style="box-shadow: inset 1px 1px 2px rgba(110, 90, 180, 0.25), inset -1px -1px 2px rgba(255, 255, 255, 0.9);">
</div>
<!-- Step 5 (Pending) -->
<div aria-hidden="true" class="w-2 h-2 rounded-full bg-[#D8D2EB]" style="box-shadow: inset 1px 1px 2px rgba(110, 90, 180, 0.25), inset -1px -1px 2px rgba(255, 255, 255, 0.9);">
</div>
</div>
<!-- Top Skip Link -->
<button aria-label="Skip resume upload step" class="text-[#5B4BD6] font-title-md text-body-md font-bold hover:opacity-80 active:scale-95 transition-transform px-2 py-1 focus:outline-none" type="button">
      Skip
    </button>
</div>
<!-- Header Section -->
<header class="mt-6">
<h1 class="font-display-lg text-display-lg text-text-primary-light tracking-tight">
      Start with your resume
    </h1>
<p class="font-body-md text-body-md text-text-secondary-light mt-2 leading-relaxed">
      We'll read it and suggest answers. You review everything before it's saved.
    </p>
</header>
<!-- Large White Clay Drop Zone Card -->
<section class="mt-6 w-full">
<div aria-label="Upload resume in PDF format, maximum 5 MB" class="w-full h-[248px] rounded-[28px] bg-gradient-to-b from-[#FFFFFF] to-[#FAF8FF] p-3 flex flex-col items-center justify-center cursor-pointer transition-transform duration-200 active:scale-[0.99]" id="dropZoneCard" role="button" style="box-shadow: 12px 12px 24px rgba(110, 90, 180, 0.18), -8px -8px 18px rgba(255, 255, 255, 0.9), inset -4px -4px 8px rgba(110, 90, 180, 0.10), inset 4px 4px 8px rgba(255, 255, 255, 0.8);" tabindex="0">
<!-- Tactile Inset Dashed Ring -->
<div class="w-full h-full rounded-[22px] flex flex-col items-center justify-center p-4 bg-[#FBF9FE]/60 relative overflow-hidden" style="box-shadow: inset 2px 2px 5px rgba(110, 90, 180, 0.05), inset -2px -2px 5px rgba(255, 255, 255, 0.6); background-image: radial-gradient(rgba(197, 184, 250, 0.4) 1px, transparent 1px); background-size: 14px 14px;">
<!-- Outer Dashed Ring Simulation -->
<svg class="absolute inset-0 w-full h-full pointer-events-none" xmlns="http://www.w3.org/2000/svg">
<rect fill="none" height="calc(100% - 4px)" rx="20" ry="20" stroke="#C5B8FA" stroke-dasharray="6 6" stroke-linecap="round" stroke-width="2" width="calc(100% - 4px)" x="2" y="2"></rect>
</svg>
<!-- 3D Clay Document Illustration -->
<div class="relative w-20 h-20 flex items-center justify-center mb-1">
<!-- Ambient Glow Pill beneath document -->
<div class="absolute w-14 h-5 bg-[#C5B8FA]/30 rounded-full blur-sm bottom-0"></div>
<!-- Inflated Soft Clay PDF Sheet -->
<div class="relative w-14 h-[68px] rounded-[14px] bg-gradient-to-b from-[#FFFFFF] to-[#F5F2FC] flex flex-col items-center justify-between p-2 transform -rotate-1 hover:rotate-0 transition-transform duration-300" style="box-shadow: 6px 8px 16px rgba(110, 90, 180, 0.22), -3px -3px 8px rgba(255, 255, 255, 0.95), inset 2px 2px 4px rgba(255, 255, 255, 0.8), inset -2px -2px 4px rgba(110, 90, 180, 0.12);">
<!-- Top Corner Fold Tactile Touch -->
<div class="absolute top-0 right-0 w-4 h-4 rounded-bl-lg bg-gradient-to-br from-[#EAE4F8] to-[#D5CBEF]" style="box-shadow: -2px 2px 4px rgba(110, 90, 180, 0.15);">
</div>
<!-- PDF Badge Pill -->
<div class="px-1.5 py-0.5 mt-0.5 rounded-full bg-tag-error-bg flex items-center justify-center" style="box-shadow: 1px 1px 3px rgba(154, 42, 30, 0.18), inset 0 1px 1px rgba(255, 255, 255, 0.8);">
<span class="font-label-md text-[10px] leading-none font-extrabold text-tag-error-text tracking-wider">PDF</span>
</div>
<!-- Debossed Content Lines -->
<div class="w-full flex flex-col gap-1.5 px-0.5 mb-1.5">
<div class="w-full h-1 bg-[#DED7F5] rounded-full" style="box-shadow: inset 1px 1px 1px rgba(110, 90, 180, 0.2), inset -1px -1px 1px rgba(255, 255, 255, 0.8);">
</div>
<div class="w-4/5 h-1 bg-[#DED7F5] rounded-full" style="box-shadow: inset 1px 1px 1px rgba(110, 90, 180, 0.2), inset -1px -1px 1px rgba(255, 255, 255, 0.8);">
</div>
<div class="w-3/5 h-1 bg-[#DED7F5] rounded-full" style="box-shadow: inset 1px 1px 1px rgba(110, 90, 180, 0.2), inset -1px -1px 1px rgba(255, 255, 255, 0.8);">
</div>
</div>
</div>
<!-- Floating Clay Upload Pill Badge -->
<div class="absolute -bottom-1 -right-1 w-8 h-8 rounded-full bg-gradient-to-tr from-[#7C6CF2] to-[#9B8DFC] flex items-center justify-center text-white" style="box-shadow: 3px 4px 10px rgba(124, 108, 242, 0.4), inset 1px 2px 3px rgba(255, 255, 255, 0.7), inset -1px -2px 3px rgba(65, 49, 170, 0.3);">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1, 'wght' 600;">arrow_upward</span>
</div>
</div>
<!-- Typography Stack inside Drop Zone -->
<h2 class="font-title-md text-title-md text-text-primary-light mt-2 tracking-tight">
          Upload resume (PDF)
        </h2>
<span class="font-caption-sm text-caption-sm text-text-secondary-light mt-0.5">
          Max 5 MB
        </span>
<!-- Hidden Native File Input for Affordance -->
<input accept=".pdf,application/pdf" class="hidden" id="resumeFileInput" type="file"/>
</div>
</div>
</section>
<!-- Tactile Privacy Info Card -->
<aside class="mt-4 w-full rounded-2xl p-3.5 px-4 flex items-center gap-3 bg-tag-alias-bg transition-shadow" role="note" style="box-shadow: 6px 8px 18px rgba(15, 106, 72, 0.1), -4px -4px 12px rgba(255, 255, 255, 0.8), inset 2px 2px 4px rgba(255, 255, 255, 0.7), inset -2px -2px 4px rgba(15, 106, 72, 0.08);">
<!-- Mint Clay Icon Disc -->
<div class="w-7 h-7 rounded-full bg-white/70 flex items-center justify-center flex-shrink-0" style="box-shadow: inset 1px 1px 2px rgba(255, 255, 255, 0.9), 1px 2px 4px rgba(15, 106, 72, 0.12);">
<span class="material-symbols-outlined text-[16px] text-tag-alias-text" style="font-variation-settings: 'FILL' 1;">
        lock
      </span>
</div>
<!-- Privacy Assurance Copy -->
<p class="font-label-md text-label-md text-tag-alias-text font-bold">
      Only you can see your resume.
    </p>
</aside>
<!-- Interactive Feedback Pill (Dynamically triggered upon file selection) -->
<div class="hidden mt-3 w-full p-3 rounded-2xl bg-icon-bg-lavender text-tag-ai-text font-label-md text-label-md flex items-center justify-between animate-fade-in" id="uploadStatus" style="box-shadow: inset 2px 2px 4px rgba(110, 90, 180, 0.15), inset -2px -2px 4px rgba(255, 255, 255, 0.8);">
<div class="flex items-center gap-2 truncate">
<span class="material-symbols-outlined text-[18px]">description</span>
<span class="truncate font-bold" id="uploadedFileName">resume_2025.pdf</span>
</div>
<span class="material-symbols-outlined text-[18px] text-[#5B4BD6]">check_circle</span>
</div>
<!-- Bottom Interactive CTA Stack -->
<div class="mt-8 pb-8 flex flex-col gap-3 w-full">
<!-- Primary Pill Clay Action Button -->
<button class="w-full h-14 rounded-full bg-[#7C6CF2] text-white font-title-md text-body-md font-bold flex items-center justify-center gap-2 active:scale-[0.98] transition-all cursor-pointer focus:outline-none" id="choosePdfBtn" style="box-shadow: 0 12px 24px rgba(124, 108, 242, 0.38), inset 0 2px 4px rgba(255, 255, 255, 0.6), inset 0 -2px 4px rgba(68, 52, 172, 0.4);" type="button">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1, 'wght' 600;">
        upload_file
      </span>
<span>Choose PDF</span>
</button>
<!-- Tactile Secondary Text Button -->
<button class="w-full py-2.5 rounded-full text-center text-[#5B4BD6] font-title-md text-body-md font-bold hover:opacity-80 active:scale-95 transition-all focus:outline-none" type="button">
      Skip for now
    </button>
</div>
</div>
<!-- Micro-Interaction JavaScript -->
<script>
  (function() {
    const fileInput = document.getElementById('resumeFileInput');
    const chooseBtn = document.getElementById('choosePdfBtn');
    const dropCard = document.getElementById('dropZoneCard');
    const statusBox = document.getElementById('uploadStatus');
    const fileNameSpan = document.getElementById('uploadedFileName');

    const triggerSelect = () => fileInput && fileInput.click();

    if (chooseBtn) {
      chooseBtn.addEventListener('click', triggerSelect);
    }

    if (dropCard) {
      dropCard.addEventListener('click', triggerSelect);
      dropCard.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          triggerSelect();
        }
      });
    }

    if (fileInput) {
      fileInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) {
          const file = e.target.files[0];
          if (fileNameSpan) fileNameSpan.textContent = file.name;
          if (statusBox) statusBox.classList.remove('hidden');
          if (chooseBtn) {
            chooseBtn.innerHTML = `
              <span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">check</span>
              <span>Continue</span>
            `;
          }
        }
      });
    }
  })();
</script></main></body></html>
