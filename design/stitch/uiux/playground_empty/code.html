rgba(110,90,180,0.12),-4px -4px 10px rgba(255,255,255,0.9),inset 2px 2px 4px rgba(255,255,255,0.8),inset -2px -2px 4px rgba(110,90,180,0.08);}</style></head><body class="bg-canvas-light text-text-primary-light min-h-screen flex flex-col font-body-md antialiased selection:bg-surface-variant"><header class="fixed top-0 w-full z-50 pt-safe bg-canvas-light/80 backdrop-blur-xl"><div class="h-16 px-margin flex items-center justify-between"><div class="flex items-center gap-space-sm"><button aria-label="Open drawer" class="w-11 h-11 rounded-full clay-icon-button flex items-center justify-center text-text-primary-light active:scale-95 transition-transform"><span class="material-symbols-outlined text-[24px]">menu</span></button><h1 class="font-title-md text-title-md text-text-primary-light">Playground</h1></div><div class="flex items-center gap-space-sm"><button aria-label="Notifications" class="w-11 h-11 rounded-full clay-icon-button flex items-center justify-center text-text-primary-light relative active:scale-95 transition-transform"><span class="material-symbols-outlined text-[22px]">notifications</span><span class="absolute top-2.5 right-2.5 w-2 h-2 rounded-full bg-primary ring-2 ring-canvas-light"></span></button><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shadow-md shadow-primary/20"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex flex-col relative w-full pt-16 pb-32 px-margin bg-canvas-light"><div class="flex flex-col w-full max-w-[480px] mx-auto space-y-space-lg">
<!-- Header Subtitle / Micro-Instruction -->
<div class="px-space-xs">
<p class="font-body-md text-body-md text-text-secondary-light leading-relaxed">
      Type any form question and see exactly how autofill would answer it.
    </p>
</div>
<!-- Query Input Section: Tactile Concave Clay Container -->
<div class="w-full">
<div class="relative flex items-center justify-between rounded-[24px] p-space-xs pl-space-lg min-h-[68px] transition-all duration-200" style="background-color: #F3F0FA; box-shadow: inset 3px 3px 6px rgba(110,90,180,0.16), inset -3px -3px 6px rgba(255,255,255,0.85);">
<input autocomplete="off" class="w-full bg-transparent font-body-md text-body-md text-text-primary-light placeholder-text-placeholder focus:outline-none pr-space-sm" id="playground-input" placeholder="Type a form question..." type="text"/>
<!-- Puffy Lavender Clay Submit Button -->
<button aria-label="Test autofill question" class="w-12 h-12 flex-shrink-0 rounded-[20px] flex items-center justify-center text-on-primary transition-all duration-200 active:scale-95" id="playground-submit" style="background: linear-gradient(180deg, #8A7BFA 0%, #7160E6 100%); box-shadow: 4px 6px 14px rgba(113, 96, 230, 0.35), inset 0 2px 4px rgba(255, 255, 255, 0.7);">
<span class="material-symbols-outlined text-[24px]">arrow_forward</span>
</button>
</div>
</div>
<!-- "Try one" Suggestion Chips Section -->
<div class="flex flex-col space-y-space-sm pt-space-xs">
<span class="font-label-md text-label-md text-text-primary-light font-bold px-space-xs">
      Try one
    </span>
<div class="flex flex-wrap gap-2.5">
<button class="h-9 px-4 rounded-full flex items-center justify-center font-label-md text-label-md text-text-primary-light transition-all duration-150 active:scale-95 clay-convex" onclick="fillQuery('Expected CTC')" type="button">
        Expected CTC
      </button>
<button class="h-9 px-4 rounded-full flex items-center justify-center font-label-md text-label-md text-text-primary-light transition-all duration-150 active:scale-95 clay-convex" onclick="fillQuery('Your email id')" type="button">
        Your email id
      </button>
<button class="h-9 px-4 rounded-full flex items-center justify-center font-label-md text-label-md text-text-primary-light transition-all duration-150 active:scale-95 clay-convex" onclick="fillQuery('Why do you want to join us?')" type="button">
        Why do you want to join us?
      </button>
<button class="h-9 px-4 rounded-full flex items-center justify-center font-label-md text-label-md text-text-primary-light transition-all duration-150 active:scale-95 clay-convex" onclick="fillQuery('Willing to relocate?')" type="button">
        Willing to relocate?
      </button>
</div>
</div>
<!-- Centered Empty State & 3D Clay Illustration -->
<div class="flex flex-col items-center justify-center pt-8 pb-4 text-center">
<!-- Visual Pod Illustration Container -->
<div class="relative w-full max-w-[240px] flex items-center justify-center mb-6">
<!-- Ambient Backlight Glow -->
<div class="absolute w-44 h-44 rounded-full bg-surface-variant/40 blur-2xl -z-10 transform scale-90"></div>
<img alt="Playground lab autofill inspection" class="w-full max-w-[210px] h-auto object-contain select-none pointer-events-none drop-shadow-md" src="https://lh3.googleusercontent.com/aida/AEtjO1Wq9p21C8Rdqe9pvMZbTWSg2lOuRHLh5jhMbsu6n23ulICrKDvvqUcbdwAMS5b8qPGczkmwyrUaeFFUkSMPH-IoXLtAU0ymI7OGZsbnCsLWOqAOPp6as7v-teuZZd3jpOUhY1YUXPrADVqIDfrKAOo-DnzzbLFUF-opcyFdQytzwqyHAIX2K0bs6IRzcYt6PxoVcvMRagdhwlb8yjITlRhadWCk-0l0e33Z884_0HYW"/>
</div>
<!-- Reassurance / Trust Badge Card -->
<div class="w-full max-w-[320px] clay-convex rounded-2xl p-4 flex items-center gap-3 text-left">
<div class="w-10 h-10 rounded-full bg-icon-bg-lavender flex items-center justify-center flex-shrink-0" style="box-shadow: inset 1px 1px 2px rgba(255,255,255,0.8), 2px 2px 6px rgba(110,90,180,0.12);">
<span class="material-symbols-outlined text-primary text-[20px]" style="font-variation-settings: 'FILL' 1;">verified</span>
</div>
<p class="font-caption-sm text-caption-sm text-text-secondary-light leading-relaxed">
        Uses the exact same matcher as real autofill, so what you see here is what forms get.
      </p>
</div>
</div>
</div>
<script>
  function fillQuery(text) {
    const input = document.getElementById('playground-input');
    if (input) {
      input.value = text;
      input.focus();
    }
  }

  document.getElementById('playground-submit')?.addEventListener('click', function() {
    const input = document.getElementById('playground-input');
    if (input && input.value.trim() !== '') {
      input.classList.add('scale-[0.99]');
      setTimeout(() => input.classList.remove('scale-[0.99]'), 150);
    } else if (input) {
      input.focus();
    }
  });
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe pointer-events-none" data-active-classes="clay-pill-active text-primary font-bold"><div class="px-space-lg pb-space-lg pt-space-xs"><div class="pointer-events-auto h-[68px] clay-convex rounded-xl px-space-sm flex items-center justify-around"><a class="flex flex-col items-center justify-center py-space-xs px-space-md rounded-full text-text-secondary-light hover:text-text-primary-light transition-all min-w-[64px] min-h-[44px]" data-path="knowledge" href="#"><span class="material-symbols-outlined text-[24px]">book</span><span class="font-caption-sm text-caption-sm mt-0.5">Knowledge</span></a><a class="flex flex-col items-center justify-center py-space-xs px-space-md rounded-full text-text-secondary-light hover:text-text-primary-light transition-all min-w-[64px] min-h-[44px]" data-path="history" href="#"><span class="material-symbols-outlined text-[24px]">history</span><span class="font-caption-sm text-caption-sm mt-0.5">History</span></a><a class="relative flex flex-col items-center justify-center py-space-xs px-space-md rounded-full text-text-secondary-light hover:text-text-primary-light transition-all min-w-[64px] min-h-[44px]" data-path="gaps" href="#"><span class="material-symbols-outlined text-[24px]">inbox</span><span class="font-caption-sm text-caption-sm mt-0.5">Gaps</span><span class="absolute top-1 right-2 min-w-[18px] h-[18px] px-1 rounded-full bg-tag-gap-bg text-tag-gap-text font-caption-sm text-[11px] font-bold flex items-center justify-center shadow-sm">3</span></a><a aria-current="page" class="flex flex-col items-center justify-center py-space-xs px-space-md rounded-full transition-all min-w-[64px] min-h-[44px] clay-pill-active text-primary font-bold" data-path="playground" href="#"><span class="material-symbols-outlined text-[24px]">science</span><span class="font-caption-sm text-caption-sm mt-0.5">Playground</span></a></div></div></nav></body></html>
