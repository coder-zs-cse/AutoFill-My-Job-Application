<script>
  // Clay Segmented Toggle Micro-interaction
  const tabQuestions = document.getElementById('tab-questions');
  const tabStories = document.getElementById('tab-stories');

  const elevatedStyle = "background: linear-gradient(180deg, #FFFFFF 0%, #FAF8FF 100%); box-shadow: 4px 4px 10px rgba(110, 90, 180, 0.14), -3px -3px 8px rgba(255, 255, 255, 0.85), inset 2px 2px 4px rgba(255, 255, 255, 0.80), inset -2px -2px 4px rgba(110, 90, 180, 0.08);";
  const inactiveStyle = "background: transparent; box-shadow: none;";

  function setActiveTab(activeEl, inactiveEl) {
    activeEl.setAttribute('style', elevatedStyle);
    activeEl.classList.remove('text-text-secondary-light');
    activeEl.classList.add('text-text-primary-light', 'font-bold');

    inactiveEl.setAttribute('style', inactiveStyle);
    inactiveEl.classList.remove('text-text-primary-light', 'font-bold');
    inactiveEl.classList.add('text-text-secondary-light');
  }

  tabQuestions.addEventListener('click', () => setActiveTab(tabQuestions, tabStories));
  tabStories.addEventListener('click', () => setActiveTab(tabStories, tabQuestions));

  // Gentle Interactive Haptic Feedback on Clay Mascot
  const stage = document.getElementById('clay-stage');
  stage.addEventListener('pointerdown', () => {
    stage.style.transform = 'scale(0.96)';
    stage.style.transition = 'transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1)';
  });
  
  window.addEventListener('pointerup', () => {
    stage.style.transform = 'scale(1)';
  });
