pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'ai.fillmate'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')

// Fillmate native modules. Dependency direction: app -> autofill -> autofill-core (never the reverse).
include ':autofill-core'  // pure Kotlin/JVM: matching rules, no Android imports
include ':autofill'       // Android library: AutofillService, activities, cache, network, session
