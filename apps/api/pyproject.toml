[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fillmate-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic-settings",
  "sqlalchemy[asyncio]",
  "asyncpg",
  "alembic",
  "pgvector",
  "redis",
  "openai",
  "python-multipart",
  "pypdf",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff"]

# Only ship the app package; alembic/ is migration scripts, not an installable package.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
pythonpath = ["."]
